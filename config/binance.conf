# The reference venue, for the pricing speed bump and for QuotingMM's model
# inputs.
#
# Read from <dict-dir>/binance.conf, or from --binance-config PATH.
# Changing a value needs a restart, not a rebuild.

# One connection, for the life of the daemon. Streams are subscribed and
# unsubscribed on it as strategies start and stop.
url = wss://fstream.binance.com/ws
# QuotingMM requires a spot stream matching the historical recorder.
# url = wss://stream.binance.com:9443/ws

# Which Binance symbol prices which instrument, and that symbol's tick
# size - the unit PricingMidMoveThreshold counts in. The tick size is here
# because nothing asks the venue for it.
#
# The key is matched against a CPM ticker's series (BTCD15M-BTC26OCT290430-0
# is BTCD15M) and against its asset (BTC), so either will do.
#
# BTCUSDT on the futures stream quotes to two decimals: 80162.60 / 80162.70.
map.BTCD15M = { BTCUSDT, tickSize: 0.1 }
map.ETHD15M = { ETHUSDT, tickSize: 0.01 }

# Set CPM_QUOTING_HISTORY_URL in the trader environment for QuotingMM.

# Nothing for this long and the price is not to be relied on; a strategy
# with the guard on withdraws and waits. BTCUSDT's touch changes many times
# a second, so five seconds of silence is a dead feed, not a quiet market.
stale_after_ms = 5000

# The feed keeps up to one hour of observed one-second reference samples.
# The sharp-move guard uses their high/low range. QuotingMM also uses live
# observations to continue the historical API state at UTC second boundaries.
# The daemon saves guard history beside its bookmark on clean shutdown.
# Override the cache location if needed (use a writable path):
# history_file = /home/trader/.cpm/reference-history
# To keep BTC/ETH history warm before starting a strategy, uncomment:
# pin = BTCUSDT
# pin = ETHUSDT
